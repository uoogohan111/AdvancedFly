name: AdvancedFly
version: ${project.version}
main: com.advancedfly.AdvancedFlyPlugin
api-version: '1.21'
description: Advanced flight management plugin with speeds, freeze, particles, and more.
authors: [ YourName ]
website: https://github.com/yourname/AdvancedFly

softdepend:
  - PlaceholderAPI
  - Vault

permissions:
  advancedfly.fly:
    description: Allows the player to toggle flight.
    default: op
  advancedfly.flyspeed:
    description: Allows the player to change their fly speed.
    default: op
  advancedfly.walkspeed:
    description: Allows the player to change their walk speed.
    default: op
  advancedfly.fly.others:
    description: Allows toggling flight for other players.
    default: op
  advancedfly.freeze:
    description: Allows the player to freeze themselves.
    default: op
  advancedfly.freeze.others:
    description: Allows freezing other players.
    default: op
  advancedfly.admin:
    description: Bypass all restrictions (world ban, cooldowns, etc.)
    default: op
    children:
      advancedfly.fly: true
      advancedfly.flyspeed: true
      advancedfly.walkspeed: true
      advancedfly.fly.others: true
      advancedfly.freeze: true
      advancedfly.freeze.others: true

commands:
  fly:
    description: Toggle flight mode on/off.
    usage: /fly [player]
    permission: advancedfly.fly
  flyspeed:
    description: Set fly speed (1-10) or reset.
    usage: /flyspeed <1-10|reset>
    permission: advancedfly.flyspeed
  walkspeed:
    description: Set walk speed (1-10) or reset.
    usage: /walkspeed <1-10|reset>
    permission: advancedfly.walkspeed
  freeze:
    description: Freeze/unfreeze yourself or another player.
    usage: /freeze [player]
    permission: advancedfly.freeze
  advancedfly:
    description: AdvancedFly admin & GUI commands.
    usage: /advancedfly <reload|gui|status>
    permission: advancedfly.admin
    aliases: [ afly ]
